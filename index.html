<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Travel Journal - 올인원 모바일 여행 플래너</title>

  <!-- PWA 메타태그 및 매니페스트 연결 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Travel Journal" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />

  <!-- 인라인 SVG 아이콘 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230284c7'/%3E%3Cpath d='M120 330l136-64 136 64-136-24z' fill='%23ffffff'/%3E%3Ccircle cx='256' cy='190' r='54' fill='none' stroke='%23e0f2fe' stroke-width='18'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230284c7'/%3E%3Cpath d='M120 330l136-64 136 64-136-24z' fill='%23ffffff'/%3E%3Ccircle cx='256' cy='190' r='54' fill='none' stroke='%23e0f2fe' stroke-width='18'/%3E%3C/svg%3E" />

  <!-- Tailwind CSS CDN & FontAwesome CDN & Leaflet.js CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    /* Netlify 자동 삽입 하단 배너 강제 숨김 */
    a[href*="netlify.com"],
    #netlify-badge,
    [id*="netlify-"],
    [class*="netlify-"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      height: 0 !important;
      overflow: hidden !important;
    }

    /* 모바일 세이프존 여백 확보 및 부드러운 터치 스크롤 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    body {
      -webkit-tap-highlight-color: transparent;
      padding-bottom: calc(5.5rem + env(safe-area-inset-bottom, 1rem));
    }

    .bottom-nav-safe {
      padding-bottom: calc(0.4rem + env(safe-area-inset-bottom, 0px));
    }

    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }

    /* Leaflet 지도 컨테이너 기본 높이 */
    #trip-map {
      height: 250px;
      width: 100%;
      border-radius: 0.875rem;
      z-index: 10;
    }

    /* A4 인쇄 / PDF 아카이브 전용 스타일 */
    @media print {
      @page { size: A4 portrait; margin: 14mm 12mm; }
      body { background: #ffffff !important; padding-bottom: 0 !important; }
      header, nav, button, form, .no-print, .fixed, #homeView { display: none !important; }
      #tripDetailView { display: block !important; max-width: 100% !important; padding: 0 !important; }
      #tabPanelItinerary, #tabPanelBookings, #tabPanelExpenses, #tabPanelReviews { display: block !important; margin-bottom: 20px !important; }
      #tabPanelPhotos, #tabPanelChecklist { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen selection:bg-sky-500 selection:text-white">

  <!-- ======================================================================
       공통 상단 헤더 (연결 상태 배지, 초대 코드 복사, 환율 갱신, 홈 복귀)
       ====================================================================== -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 px-3 py-2.5 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between gap-1.5">
      <!-- 좌측: 홈 복귀 버튼(상세 화면) + 로고/제목 + 연결 상태 배지 -->
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <button id="btnHeaderBackHome" type="button" class="touch-target hidden px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold flex items-center gap-1 shrink-0 transition" title="홈으로 돌아가기">
          <i class="fa-solid fa-house text-[11px]"></i>
          <span>홈</span>
        </button>

        <div id="headerLogoIcon" class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-600 to-indigo-700 text-white flex items-center justify-center shrink-0 shadow-xs">
          <i class="fa-solid fa-book-atlas text-sm"></i>
        </div>

        <div class="min-w-0 flex-1">
          <h1 id="headerTitleDisplay" class="text-sm font-extrabold tracking-tight text-slate-800 truncate">Travel Journal</h1>
          <span id="connectionStatusBadge" class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">
            ⚪ 오프라인
          </span>
        </div>
      </div>

      <!-- 우측: 초대 코드 복사 버튼 + 실시간 환율 조회 버튼 -->
      <div class="flex items-center gap-1 shrink-0">
        <button id="btnHeaderCopyInvite" type="button" class="touch-target hidden px-2.5 rounded-xl bg-sky-50 border border-sky-200 text-sky-700 hover:bg-sky-100 text-[11px] font-mono font-bold flex items-center gap-1 transition" title="초대 코드 복사">
          <span id="headerInviteCodeText">TR-0000</span>
          <i class="fa-regular fa-copy text-[10px]"></i>
        </button>

        <button id="btnHeaderRefreshRates" type="button" class="touch-target px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-bold flex items-center gap-1 transition" title="실시간 환율 조회">
          <i class="fa-solid fa-arrows-rotate text-sky-600"></i>
          <span>환율</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ======================================================================
       [뷰 A] 홈 화면 (#homeView) - 내 여행 목록 & 전체 리뷰 아카이브
       ====================================================================== -->
  <div id="homeView" class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- 홈 서브 뷰 전환 스위치 (내 여행 목록 vs 전체 리뷰 아카이브) -->
    <div class="grid grid-cols-2 bg-slate-200/75 p-1 rounded-2xl text-xs font-extrabold text-slate-600">
      <button id="btnHomeTabTrips" type="button" data-home-view="trips" class="touch-target rounded-xl bg-white text-sky-600 shadow-xs transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-suitcase-rolling"></i>
        <span>내 여행 목록</span>
      </button>
      <button id="btnHomeTabAllReviews" type="button" data-home-view="reviews" class="touch-target rounded-xl text-slate-500 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-star text-amber-500"></i>
        <span>전체 리뷰 아카이브</span>
      </button>
    </div>

    <!-- [홈 섹션 1] 내 여행 목록 (#homeTripsSection) -->
    <div id="homeTripsSection" class="space-y-4">
      <!-- 새 여행 만들기 히어로 카드 -->
      <section class="bg-gradient-to-br from-sky-600 via-sky-700 to-slate-900 rounded-2xl p-4 text-white shadow-sm space-y-3">
        <div class="space-y-1">
          <span class="text-[10px] font-bold uppercase tracking-wider text-sky-200">Personal & Group Travel Diary</span>
          <h2 class="text-base font-extrabold leading-snug">설레는 여정의 모든 기록을<br />한 권의 노트에 담아보세요</h2>
        </div>
        <button id="btnOpenNewTripModal" type="button" class="touch-target w-full py-3 px-4 rounded-xl bg-white hover:bg-sky-50 active:scale-[0.99] text-slate-900 text-xs font-extrabold shadow-xs flex items-center justify-center gap-1.5 transition">
          <i class="fa-solid fa-plus text-sky-600"></i>
          <span>새 여행 만들기</span>
        </button>
      </section>

      <!-- 초대 코드로 참여 카드 -->
      <section class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-2.5">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-extrabold text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-ticket text-sky-600"></i>
            <span>초대 코드로 참여</span>
          </h3>
          <span class="text-[10px] text-slate-400">일행과 일정·정산·사진 실시간 공유</span>
        </div>
        <form id="formHomeJoinTrip" class="space-y-2">
          <div class="grid grid-cols-5 gap-2">
            <input id="inputHomeJoinCode" type="text" placeholder="코드 (TR-XXXX)" class="touch-target col-span-3 uppercase font-mono bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs font-bold outline-none focus:border-sky-500" required />
            <input id="inputHomeJoinNickname" type="text" placeholder="내 닉네임" class="touch-target col-span-2 bg-slate-50 border border-slate-200 rounded-xl px-3 text-xs font-medium outline-none focus:border-sky-500" required />
          </div>
          <button id="btnSubmitHomeJoin" type="submit" class="touch-target w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-900 active:scale-[0.99] text-white text-xs font-extrabold transition">
            초대 코드로 여행 합류하기
          </button>
        </form>
      </section>

      <!-- 진행 중 / 예정된 내 여행 카드 목록 -->
      <section class="space-y-2.5">
        <div class="flex items-center justify-between px-1">
          <h3 class="text-xs font-extrabold text-slate-700">내 여행 카드 목록 <span id="homeTripCountBadge" class="text-sky-600 ml-1">0</span></h3>
          <span id="homeLiveRateSummary" class="text-[10px] text-slate-400">환율 정보 대기 중</span>
        </div>
        <div id="homeTripCardsList" class="space-y-3"></div>
      </section>
    </div>

    <!-- [홈 섹션 2] 전체 리뷰 아카이브 (#homeAllReviewsSection) -->
    <div id="homeAllReviewsSection" class="space-y-3 hidden">
      <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-xs space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-sm font-extrabold text-slate-800">전체 여행 방문 리뷰 아카이브</h2>
            <p class="text-[11px] text-slate-500">모든 여행에서 기록한 맛집·숙소·관광지 후기 통합 피드</p>
          </div>
          <span id="archiveTotalReviewCount" class="text-xs font-extrabold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200">총 0건</span>
        </div>

        <!-- 검색어 입력 + 별점순 정렬 -->
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-2 relative">
            <i class="fa-solid fa-magnifying-glass text-xs text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
            <input id="inputArchiveReviewSearch" type="text" placeholder="장소명, 여행명, 키워드 검색..." class="touch-target w-full bg-slate-50 border border-slate-200 rounded-xl pl-8 pr-3 text-xs font-medium outline-none focus:border-sky-500" />
          </div>
          <select id="selectArchiveReviewSort" class="touch-target bg-slate-50 border border-slate-200 rounded-xl px-2.5 text-xs font-bold text-slate-700 outline-none focus:border-sky-500">
            <option value="ratingDesc">별점 높은순</option>
            <option value="latest">최신 등록순</option>
            <option value="ratingAsc">별점 낮은순</option>
          </select>
        </div>

        <!-- 카테고리 필터 (전체, 숙소, 식당, 관광지, 쇼핑, 기타) -->
        <div id="archiveReviewCategoryBar" class="flex overflow-x-auto no-scrollbar gap-1.5 pb-0.5">
          <button type="button" data-archive-cat="전체" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-extrabold bg-slate-800 text-white">전체</button>
          <button type="button" data-archive-cat="숙소" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">숙소</button>
          <button type="button" data-archive-cat="식당" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">식당</button>
          <button type="button" data-archive-cat="관광지" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">관광지</button>
          <button type="button" data-archive-cat="쇼핑" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">쇼핑</button>
          <button type="button" data-archive-cat="기타" class="archive-cat-btn touch-target shrink-0 px-3 rounded-xl text-xs font-bold bg-slate-100 text-slate-600">기타</button>
        </div>
      </div>

      <!-- 통합 리뷰 피드 리스트 -->
      <div id="archiveReviewFeedContainer" class="space-y-3"></div>
    </div>
  </div>

  <!-- ======================================================================
       [뷰 B] 여행 상세 화면 (#tripDetailView) - 6개 메인 탭
       ====================================================================== -->
  <div id="tripDetailView" class="hidden max-w-md mx-auto px-4 pt-3 space-y-4">
    <!-- 여행 요약 및 수정 배너 -->
    <div class="bg-white rounded-2xl p-3.5 border border-slate-200/80 shadow-2xs flex items-center justify-between gap-2">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5 flex-wrap">
          <span id="detailTripDestBadge" class="text-[10px] font-extrabold px-2 py-0.5 rounded-full bg-sky-50 text-sky-700 border border-sky-100">여행지</span>
          <span id="detailTripCurrencyBadge" class="text-[10px] font-mono font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">KRW</span>
          <span id="detailMyRoleBadge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-amber-50 text-amber-700 border border-amber-100">나: 나</span>
        </div>
        <h2 id="detailTripTitle" class="text-sm font-extrabold text-slate-800 truncate mt-1">여행 제목</h2>
        <p id="detailTripSubtitle" class="text-[11px] text-slate-500 truncate">2026-11-12 ~ 2026-11-15 · 2명</p>
      </div>
      <button id="btnOpenEditTripModal" type="button" class="touch-target px-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold flex items-center gap-1 shrink-0 transition" title="여행 정보 수정">
        <i class="fa-solid fa-gear"></i>
        <span>수정</span>
      </button>
    </div>
